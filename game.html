<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>仓鼠闯迷宫</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            touch-action: none;
        }
        #gameContainer {
            position: relative;
            background: #0f0f23;
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        #gameCanvas {
            display: block;
        }
        .menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 15, 35, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }
        .menu-title {
            font-size: 48px;
            color: #fff;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            margin-bottom: 20px;
        }
        .menu-subtitle {
            font-size: 20px;
            color: #aaa;
            margin-bottom: 40px;
        }
        .menu-btn {
            padding: 15px 40px;
            font-size: 18px;
            margin: 10px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        .btn-start {
            background: linear-gradient(180deg, #4CAF50 0%, #2E7D32 100%);
            color: white;
            box-shadow: 0 5px 0 #1B5E20;
        }
        .btn-start:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #1B5E20;
        }
        .btn-levels {
            background: linear-gradient(180deg, #FF9800 0%, #E65100 100%);
            color: white;
            box-shadow: 0 5px 0 #BF360C;
        }
        .btn-levels:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #BF360C;
        }
        .victory-screen, .gameover-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 15, 35, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }
        .victory-title {
            font-size: 42px;
            color: #4CAF50;
            margin-bottom: 20px;
        }
        .gameover-title {
            font-size: 42px;
            color: #f44336;
            margin-bottom: 20px;
        }
        .stats {
            font-size: 18px;
            color: #ccc;
            margin: 10px;
        }
        .ui-top {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            align-items: center;
            color: white;
            font-size: 16px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        .ui-right {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            align-items: center;
        }
        .food-counter {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }
        .health-bar {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .health-icon {
            font-size: 20px;
        }
        .health-segments {
            display: flex;
            gap: 3px;
        }
        .health-segment {
            width: 20px;
            height: 16px;
            background: #333;
            border-radius: 3px;
            border: 1px solid #555;
        }
        .health-segment.filled {
            background: linear-gradient(180deg, #4CAF50 0%, #2E7D32 100%);
            border-color: #4CAF50;
        }
        .level-info {
            font-weight: bold;
        }
        .game-title {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 15px;
        }
        .food-notify {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(76, 175, 80, 0.9);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .food-notify.show {
            opacity: 1;
        }
        .exit-notify {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 152, 0, 0.9);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 100;
        }
        .exit-notify.show {
            opacity: 1;
        }
        .mobile-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            top: 0;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }
        .control-dpad {
            position: absolute;
            left: 20px;
            bottom: 30px;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 5px;
            pointer-events: auto;
        }
        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            background: rgba(255,255,255,0.15);
            border: 3px solid rgba(255,255,255,0.3);
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.1s;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .control-btn:active, .control-btn.pressed {
            background: rgba(255,255,255,0.4);
            transform: scale(0.95);
        }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }
        .level-select-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 15, 35, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }
        .level-grid {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .level-cell {
            width: 100px;
            height: 100px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 24px;
            font-weight: bold;
            color: white;
        }
        .level-cell.locked {
            background: #333;
            cursor: not-allowed;
        }
        .level-cell.unlocked {
            background: linear-gradient(180deg, #FF9800 0%, #E65100 100%);
        }
        .level-cell.unlocked:hover {
            transform: scale(1.1);
        }
        .level-cell.completed {
            background: linear-gradient(180deg, #4CAF50 0%, #2E7D32 100%);
        }
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 25px;
            font-size: 16px;
            background: #555;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div class="game-title" id="gameTitle">🐹 芝芝闯迷宫</div>
        <div class="ui-top" id="uiTop">
            <div class="health-bar">
                <span class="health-icon">🐹</span>
                <div class="health-segments" id="healthBar"></div>
            </div>
            <div class="level-info" id="levelInfo">第1关</div>
        </div>
        <div class="ui-right" id="uiRight">
            <div class="food-counter" id="foodCounter">已获取食物数量：0</div>
        </div>
        <div class="food-notify" id="foodNotify">+1 体力！</div>
        <div class="exit-notify" id="exitNotify">要吃完所有食物才能抵达终点哦！</div>
        <div class="menu-screen" id="mainMenu">
            <div class="menu-title">🐹 仓鼠闯迷宫</div>
            <div class="menu-subtitle">帮助仓鼠找到出口</div>
            <button class="menu-btn btn-start" onclick="startGame()">开始游戏</button>
            <button class="menu-btn btn-levels" onclick="showLevelSelect()">选择关卡</button>
        </div>
        <div class="level-select-screen" id="levelSelect">
            <button class="back-btn" onclick="hideLevelSelect()">返回</button>
            <h2 style="color:#FF9800; margin-bottom:20px;">选择关卡</h2>
            <div class="level-grid" id="levelGrid"></div>
        </div>
        <div class="victory-screen" id="victoryScreen">
            <div class="victory-title">🎉 恭喜过关！</div>
            <div class="stats" id="victoryStats"></div>
            <button class="menu-btn btn-start" onclick="nextLevel()">下一关 →</button>
            <button class="menu-btn btn-levels" onclick="showLevelSelect()">关卡选择</button>
        </div>
        <div class="gameover-screen" id="gameoverScreen">
            <div class="gameover-title">💀 被猫咪抓住了！</div>
            <div class="stats" id="gameoverStats"></div>
            <button class="menu-btn btn-start" onclick="retryLevel()">重新挑战</button>
            <button class="menu-btn btn-levels" onclick="showLevelSelect()">关卡选择</button>
        </div>
        <div class="mobile-controls" id="mobileControls" style="display:none;">
            <div class="control-dpad">
                <div class="control-btn btn-up" id="btnUp">↑</div>
                <div class="control-btn btn-left" id="btnLeft">←</div>
                <div class="control-btn btn-right" id="btnRight">→</div>
                <div class="control-btn btn-down" id="btnDown">↓</div>
            </div>
        </div>
    </div>
    <script>
        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 600;
        const CELL_SIZE = 40;
        const COLS = 20;
        const ROWS = 15;
        
        let canvas, ctx;
        let gameState = 'menu';
        let currentLevel = 0;
        let unlockedLevels = [0];
        let levelStats = {};
        
        let player = { x: 1, y: 1, health: 3, maxHealth: 3 };
        let cats = [];
        let foods = [];
        let maze = [];
        let exitPos = { x: 0, y: 0 };
        
        let keys = { up: false, down: false, left: false, right: false };
        let moveTimer = 0;
        const MOVE_DELAY = 150;
        
        let audioCtx = null;
        let bgMusicPlaying = false;
        
        const levels = [
            {
                name: '第1关',
                catCount: 2,
                foodCount: 5,
                catSpeed: 1.5,
                catPatrolRange: 3
            },
            {
                name: '第2关',
                catCount: 3,
                foodCount: 7,
                catSpeed: 2,
                catPatrolRange: 4
            },
            {
                name: '第3关',
                catCount: 4,
                foodCount: 9,
                catSpeed: 2.5,
                catPatrolRange: 5
            }
        ];
        
        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            canvas.width = CANVAS_WIDTH;
            canvas.height = CANVAS_HEIGHT;
            
            loadSaveData();
            updateLevelSelect();
            
            document.addEventListener('keydown', handleKeyDown);
            document.addEventListener('keyup', handleKeyUp);
            
            setupMobileControls();
            
            document.getElementById('mainMenu').style.display = 'flex';
            
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }
        
        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            const maxWidth = window.innerWidth * 0.95;
            const maxHeight = window.innerHeight * 0.95;
            const ratio = CANVAS_WIDTH / CANVAS_HEIGHT;
            
            let width = maxWidth;
            let height = width / ratio;
            
            if (height > maxHeight) {
                height = maxHeight;
                width = height * ratio;
            }
            
            container.style.width = width + 'px';
            container.style.height = height + 'px';
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
        }
        
        function handleKeyDown(e) {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = true;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
        }
        
        function handleKeyUp(e) {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
        }
        
        function setupMobileControls() {
            const btnUp = document.getElementById('btnUp');
            const btnDown = document.getElementById('btnDown');
            const btnLeft = document.getElementById('btnLeft');
            const btnRight = document.getElementById('btnRight');
            
            function addTouchEvents(btn, key) {
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    keys[key] = true;
                    btn.classList.add('pressed');
                });
                btn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    keys[key] = false;
                    btn.classList.remove('pressed');
                });
                btn.addEventListener('touchcancel', (e) => {
                    keys[key] = false;
                    btn.classList.remove('pressed');
                });
                btn.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    keys[key] = true;
                    btn.classList.add('pressed');
                });
                btn.addEventListener('mouseup', (e) => {
                    keys[key] = false;
                    btn.classList.remove('pressed');
                });
                btn.addEventListener('mouseleave', (e) => {
                    keys[key] = false;
                    btn.classList.remove('pressed');
                });
            }
            
            addTouchEvents(btnUp, 'up');
            addTouchEvents(btnDown, 'down');
            addTouchEvents(btnLeft, 'left');
            addTouchEvents(btnRight, 'right');
        }
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        function playSound(type) {
            if (!audioCtx) return;
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            switch(type) {
                case 'move':
                    oscillator.frequency.value = 220;
                    oscillator.type = 'sine';
                    gainNode.gain.value = 0.1;
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.05);
                    break;
                case 'eat':
                    oscillator.frequency.value = 440;
                    oscillator.type = 'sine';
                    gainNode.gain.value = 0.15;
                    oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.15);
                    break;
                case 'hurt':
                    oscillator.frequency.value = 150;
                    oscillator.type = 'sawtooth';
                    gainNode.gain.value = 0.2;
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.3);
                    break;
                case 'win':
                    const notes = [523, 659, 784, 1047];
                    notes.forEach((freq, i) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.frequency.value = freq;
                        osc.type = 'sine';
                        gain.gain.value = 0.15;
                        osc.start(audioCtx.currentTime + i * 0.15);
                        osc.stop(audioCtx.currentTime + i * 0.15 + 0.3);
                    });
                    break;
                case 'gameover':
                    oscillator.frequency.value = 200;
                    oscillator.type = 'sawtooth';
                    gainNode.gain.value = 0.2;
                    oscillator.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5);
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.5);
                    break;
            }
        }
        
        function generateMaze() {
            maze = [];
            for (let y = 0; y < ROWS; y++) {
                maze[y] = [];
                for (let x = 0; x < COLS; x++) {
                    if (y === 0 || y === ROWS - 1 || x === 0 || x === COLS - 1) {
                        maze[y][x] = 1;
                    } else {
                        maze[y][x] = Math.random() < 0.25 ? 1 : 0;
                    }
                }
            }
            
            player.x = 1;
            player.y = 1;
            maze[1][1] = 0;
            
            exitPos = { x: COLS - 2, y: ROWS - 2 };
            maze[exitPos.y][exitPos.x] = 0;
            
            ensurePath();
        }
        
        function ensurePath() {
            let x = 1, y = 1;
            while (x !== exitPos.x || y !== exitPos.y) {
                if (x < exitPos.x && Math.random() > 0.3) {
                    x++;
                } else if (y < exitPos.y && Math.random() > 0.3) {
                    y++;
                } else if (x < exitPos.x) {
                    x++;
                } else {
                    y++;
                }
                if (maze[y] && maze[y][x] !== undefined) {
                    maze[y][x] = 0;
                }
            }
        }
        
        function spawnCats() {
            cats = [];
            const level = levels[currentLevel];
            for (let i = 0; i < level.catCount; i++) {
                let x, y;
                do {
                    x = Math.floor(Math.random() * (COLS - 4)) + 2;
                    y = Math.floor(Math.random() * (ROWS - 4)) + 2;
                } while (maze[y][x] === 1 || (Math.abs(x - player.x) < 5 && Math.abs(y - player.y) < 5));
                
                cats.push({
                    x: x,
                    y: y,
                    originX: x,
                    originY: y,
                    direction: Math.floor(Math.random() * 4),
                    timer: 0,
                    speed: level.catSpeed,
                    patrolRange: level.catPatrolRange,
                    moveInterval: 500
                });
            }
        }
        
        function spawnFoods() {
            foods = [];
            const level = levels[currentLevel];
            
            const reachable = getReachableCells();
            
            for (let i = 0; i < level.foodCount; i++) {
                let x, y;
                let attempts = 0;
                do {
                    x = Math.floor(Math.random() * (COLS - 2)) + 1;
                    y = Math.floor(Math.random() * (ROWS - 2)) + 1;
                    attempts++;
                } while ((maze[y][x] === 1 || !reachable[y][x] ||
                         (x === player.x && y === player.y) || 
                         (x === exitPos.x && y === exitPos.y) ||
                         foods.some(f => f.x === x && f.y === y)) && attempts < 100);
                
                if (attempts < 100) {
                    foods.push({ x: x, y: y, collected: false });
                }
            }
        }
        
        function getReachableCells() {
            const reachable = [];
            for (let y = 0; y < ROWS; y++) {
                reachable[y] = [];
                for (let x = 0; x < COLS; x++) {
                    reachable[y][x] = false;
                }
            }
            
            const queue = [{ x: player.x, y: player.y }];
            reachable[player.y][player.x] = true;
            
            while (queue.length > 0) {
                const current = queue.shift();
                const directions = [
                    { dx: 0, dy: -1 },
                    { dx: 1, dy: 0 },
                    { dx: 0, dy: 1 },
                    { dx: -1, dy: 0 }
                ];
                
                for (const dir of directions) {
                    const nx = current.x + dir.dx;
                    const ny = current.y + dir.dy;
                    
                    if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS &&
                        maze[ny][nx] === 0 && !reachable[ny][nx]) {
                        reachable[ny][nx] = true;
                        queue.push({ x: nx, y: ny });
                    }
                }
            }
            
            return reachable;
        }
        
        function startGame() {
            initAudio();
            currentLevel = 0;
            gameState = 'playing';
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('levelSelect').style.display = 'none';
            document.getElementById('victoryScreen').style.display = 'none';
            document.getElementById('gameoverScreen').style.display = 'none';
            document.getElementById('mobileControls').style.display = 'block';
            document.getElementById('gameTitle').style.display = 'block';
            loadLevel(currentLevel);
            requestAnimationFrame(gameLoop);
        }
        
        function showLevelSelect() {
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('victoryScreen').style.display = 'none';
            document.getElementById('gameoverScreen').style.display = 'none';
            document.getElementById('levelSelect').style.display = 'flex';
            updateLevelSelect();
        }
        
        function hideLevelSelect() {
            document.getElementById('levelSelect').style.display = 'none';
            document.getElementById('mainMenu').style.display = 'flex';
        }
        
        function updateLevelSelect() {
            const grid = document.getElementById('levelGrid');
            grid.innerHTML = '';
            
            for (let i = 0; i < 3; i++) {
                const cell = document.createElement('div');
                cell.className = 'level-cell';
                
                if (unlockedLevels.includes(i)) {
                    cell.classList.add(levelStats[i] ? 'completed' : 'unlocked');
                    cell.innerHTML = `${levels[i].name}<br>${levelStats[i] ? '⭐' : ''}`;
                    cell.onclick = () => selectLevel(i);
                } else {
                    cell.classList.add('locked');
                    cell.innerHTML = '🔒';
                }
                
                grid.appendChild(cell);
            }
        }
        
        function selectLevel(levelIndex) {
            initAudio();
            currentLevel = levelIndex;
            gameState = 'playing';
            document.getElementById('levelSelect').style.display = 'none';
            document.getElementById('victoryScreen').style.display = 'none';
            document.getElementById('gameoverScreen').style.display = 'none';
            document.getElementById('mobileControls').style.display = 'block';
            document.getElementById('gameTitle').style.display = 'block';
            loadLevel(currentLevel);
            requestAnimationFrame(gameLoop);
        }
        
        function loadLevel(levelIndex) {
            player.health = player.maxHealth;
            player.x = 1;
            player.y = 1;
            
            generateMaze();
            spawnCats();
            spawnFoods();
            
            updateHealthBar();
            updateFoodCounter();
            document.getElementById('levelInfo').textContent = levels[levelIndex].name;
        }
        
        function updateFoodCounter() {
            const collected = foods.filter(f => f.collected).length;
            document.getElementById('foodCounter').textContent = `已获取食物数量：${collected}`;
        }
        
        function updateHealthBar() {
            const bar = document.getElementById('healthBar');
            bar.innerHTML = '';
            for (let i = 0; i < player.maxHealth; i++) {
                const segment = document.createElement('div');
                segment.className = 'health-segment';
                if (i < player.health) {
                    segment.classList.add('filled');
                }
                bar.appendChild(segment);
            }
        }
        
        let lastTime = 0;
        function gameLoop(currentTime) {
            if (gameState !== 'playing') return;
            
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;
            
            update(deltaTime);
            render();
            
            requestAnimationFrame(gameLoop);
        }
        
        function update(dt) {
            moveTimer += dt;
            
            if (moveTimer >= MOVE_DELAY) {
                let newX = player.x;
                let newY = player.y;
                
                if (keys.up) newY--;
                else if (keys.down) newY++;
                else if (keys.left) newX--;
                else if (keys.right) newX++;
                
                if ((newX !== player.x || newY !== player.y) && 
                    newX >= 0 && newX < COLS && newY >= 0 && newY < ROWS &&
                    maze[newY][newX] === 0) {
                    player.x = newX;
                    player.y = newY;
                    playSound('move');
                }
                
                moveTimer = 0;
            }
            
            updateCats(dt);
            checkFoodCollision();
            checkCatCollision();
            checkExit();
        }
        
        function updateCats(dt) {
            const level = levels[currentLevel];
            
            cats.forEach(cat => {
                cat.timer += dt;
                
                if (cat.timer >= cat.moveInterval) {
                    cat.timer = 0;
                    
                    const directions = [
                        { dx: 0, dy: -1 },
                        { dx: 1, dy: 0 },
                        { dx: 0, dy: 1 },
                        { dx: -1, dy: 0 }
                    ];
                    
                    let moved = false;
                    for (let i = 0; i < 4; i++) {
                        const idx = (cat.direction + i) % 4;
                        const dir = directions[idx];
                        const newX = cat.x + dir.dx;
                        const newY = cat.y + dir.dy;
                        
                        if (newX >= 0 && newX < COLS && newY >= 0 && newY < ROWS &&
                            maze[newY][newX] === 0 &&
                            Math.abs(newX - cat.originX) <= cat.patrolRange &&
                            Math.abs(newY - cat.originY) <= cat.patrolRange) {
                            cat.x = newX;
                            cat.y = newY;
                            cat.direction = idx;
                            moved = true;
                            break;
                        }
                    }
                    
                    if (!moved) {
                        cat.direction = Math.floor(Math.random() * 4);
                    }
                }
            });
        }
        
        function checkFoodCollision() {
            foods.forEach(food => {
                if (!food.collected && food.x === player.x && food.y === player.y) {
                    food.collected = true;
                    player.health = Math.min(player.health + 1, player.maxHealth);
                    updateHealthBar();
                    updateFoodCounter();
                    playSound('eat');
                    showFoodNotify();
                }
            });
        }
        
        function showFoodNotify() {
            const notify = document.getElementById('foodNotify');
            notify.classList.add('show');
            setTimeout(() => {
                notify.classList.remove('show');
            }, 800);
        }
        
        function checkCatCollision() {
            cats.forEach(cat => {
                if (cat.x === player.x && cat.y === player.y) {
                    player.health--;
                    playSound('hurt');
                    
                    if (player.health <= 0) {
                        gameOver();
                    } else {
                        player.x = 1;
                        player.y = 1;
                        updateHealthBar();
                    }
                }
            });
        }
        
        function checkExit() {
            if (player.x === exitPos.x && player.y === exitPos.y) {
                const remainingFoods = foods.filter(f => !f.collected).length;
                if (remainingFoods > 0) {
                    showExitNotify();
                } else {
                    gameWin();
                }
            }
        }
        
        function showExitNotify() {
            const notify = document.getElementById('exitNotify');
            notify.classList.add('show');
            setTimeout(() => {
                notify.classList.remove('show');
            }, 1500);
        }
        
        function gameWin() {
            gameState = 'victory';
            playSound('win');
            
            levelStats[currentLevel] = { completed: true };
            
            if (currentLevel + 1 < 3 && !unlockedLevels.includes(currentLevel + 1)) {
                unlockedLevels.push(currentLevel + 1);
            }
            
            saveSaveData();
            
            document.getElementById('victoryStats').innerHTML = `
                <p>🐹 收集食物: ${foods.filter(f => f.collected).length} / ${foods.length}</p>
            `;
            
            if (currentLevel >= 2) {
                document.querySelector('#victoryScreen .btn-start').textContent = '🏆 重新开始';
            } else {
                document.querySelector('#victoryScreen .btn-start').textContent = '下一关 →';
            }
            
            document.getElementById('victoryScreen').style.display = 'flex';
            document.getElementById('mobileControls').style.display = 'none';
        }
        
        function gameOver() {
            gameState = 'gameover';
            playSound('gameover');
            
            document.getElementById('gameoverStats').innerHTML = `
                <p>💀 剩余生命: ${player.health}</p>
            `;
            
            document.getElementById('gameoverScreen').style.display = 'flex';
            document.getElementById('mobileControls').style.display = 'none';
        }
        
        function nextLevel() {
            if (currentLevel >= 2) {
                currentLevel = 0;
            } else {
                currentLevel++;
            }
            gameState = 'playing';
            document.getElementById('victoryScreen').style.display = 'none';
            document.getElementById('mobileControls').style.display = 'block';
            document.getElementById('gameTitle').style.display = 'block';
            loadLevel(currentLevel);
            requestAnimationFrame(gameLoop);
        }
        
        function retryLevel() {
            gameState = 'playing';
            document.getElementById('gameoverScreen').style.display = 'none';
            document.getElementById('mobileControls').style.display = 'block';
            document.getElementById('gameTitle').style.display = 'block';
            loadLevel(currentLevel);
            requestAnimationFrame(gameLoop);
        }
        
        function render() {
            ctx.fillStyle = '#0f0f23';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const px = x * CELL_SIZE;
                    const py = y * CELL_SIZE;
                    
                    if (maze[y][x] === 1) {
                        ctx.fillStyle = '#2a2a4a';
                        ctx.fillRect(px, py, CELL_SIZE, CELL_SIZE);
                        ctx.strokeStyle = '#3a3a6a';
                        ctx.strokeRect(px + 1, py + 1, CELL_SIZE - 2, CELL_SIZE - 2);
                    } else {
                        ctx.fillStyle = '#1a1a3a';
                        ctx.fillRect(px, py, CELL_SIZE, CELL_SIZE);
                    }
                }
            }
            
            ctx.fillStyle = '#4CAF50';
            ctx.beginPath();
            ctx.arc(exitPos.x * CELL_SIZE + CELL_SIZE / 2, exitPos.y * CELL_SIZE + CELL_SIZE / 2, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#81C784';
            ctx.beginPath();
            ctx.arc(exitPos.x * CELL_SIZE + CELL_SIZE / 2, exitPos.y * CELL_SIZE + CELL_SIZE / 2, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('出口', exitPos.x * CELL_SIZE + CELL_SIZE / 2, exitPos.y * CELL_SIZE + CELL_SIZE / 2 + 30);
            
            foods.forEach(food => {
                if (!food.collected) {
                    ctx.fillStyle = '#FFD54F';
                    ctx.beginPath();
                    ctx.arc(food.x * CELL_SIZE + CELL_SIZE / 2, food.y * CELL_SIZE + CELL_SIZE / 2, 12, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FFA000';
                    ctx.beginPath();
                    ctx.arc(food.x * CELL_SIZE + CELL_SIZE / 2 - 3, food.y * CELL_SIZE + CELL_SIZE / 2 - 3, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            
            cats.forEach(cat => {
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.arc(cat.x * CELL_SIZE + CELL_SIZE / 2, cat.y * CELL_SIZE + CELL_SIZE / 2 + 5, 15, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.moveTo(cat.x * CELL_SIZE + CELL_SIZE / 2 - 12, cat.y * CELL_SIZE + CELL_SIZE / 2 - 5);
                ctx.lineTo(cat.x * CELL_SIZE + CELL_SIZE / 2 - 18, cat.y * CELL_SIZE - 5);
                ctx.lineTo(cat.x * CELL_SIZE + CELL_SIZE / 2 - 6, cat.y * CELL_SIZE + 5);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(cat.x * CELL_SIZE + CELL_SIZE / 2 + 12, cat.y * CELL_SIZE + CELL_SIZE / 2 - 5);
                ctx.lineTo(cat.x * CELL_SIZE + CELL_SIZE / 2 + 18, cat.y * CELL_SIZE - 5);
                ctx.lineTo(cat.x * CELL_SIZE + CELL_SIZE / 2 + 6, cat.y * CELL_SIZE + 5);
                ctx.fill();
                
                ctx.fillStyle = '#f44336';
                ctx.beginPath();
                ctx.arc(cat.x * CELL_SIZE + CELL_SIZE / 2 - 5, cat.y * CELL_SIZE + CELL_SIZE / 2 + 3, 3, 0, Math.PI * 2);
                ctx.arc(cat.x * CELL_SIZE + CELL_SIZE / 2 + 5, cat.y * CELL_SIZE + CELL_SIZE / 2 + 3, 3, 0, Math.PI * 2);
                ctx.fill();
            });
            
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(player.x * CELL_SIZE + CELL_SIZE / 2, player.y * CELL_SIZE + CELL_SIZE / 2 + 3, 14, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#FFB6C1';
            ctx.beginPath();
            ctx.ellipse(player.x * CELL_SIZE + CELL_SIZE / 2 - 8, player.y * CELL_SIZE + CELL_SIZE / 2 - 6, 4, 6, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(player.x * CELL_SIZE + CELL_SIZE / 2 + 8, player.y * CELL_SIZE + CELL_SIZE / 2 - 6, 4, 6, 0.3, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(player.x * CELL_SIZE + CELL_SIZE / 2 - 4, player.y * CELL_SIZE + CELL_SIZE / 2, 2, 0, Math.PI * 2);
            ctx.arc(player.x * CELL_SIZE + CELL_SIZE / 2 + 4, player.y * CELL_SIZE + CELL_SIZE / 2, 2, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#FFB6C1';
            ctx.beginPath();
            ctx.arc(player.x * CELL_SIZE + CELL_SIZE / 2, player.y * CELL_SIZE + CELL_SIZE / 2 + 4, 2, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function saveSaveData() {
            localStorage.setItem('hamsterMaze_unlocked', JSON.stringify(unlockedLevels));
            localStorage.setItem('hamsterMaze_stats', JSON.stringify(levelStats));
        }
        
        function loadSaveData() {
            const unlocked = localStorage.getItem('hamsterMaze_unlocked');
            const stats = localStorage.getItem('hamsterMaze_stats');
            if (unlocked) unlockedLevels = JSON.parse(unlocked);
            if (stats) levelStats = JSON.parse(stats);
        }
        
        window.onload = init;
    </script>
</body>
</html>
